openapi: 3.0.3
info:
  title: TraceRoute API
  version: 2.0.0
  description: |
    QR + challenge based campus hunt. All `/game/*` and `/admin/*` calls need
    `Authorization: Bearer <token>`. Every `/game/*` response carries a `state`
    object that the client renders as-is.
servers:
  - url: http://localhost:5000/api
tags:
  - name: Auth
  - name: Game
  - name: Admin
  - name: Settings

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        msg: { type: string }
    Challenge:
      type: object
      description: Answer-free view of the open question
      properties:
        level: { type: integer }
        prompt: { type: string }
        section: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              text: { type: string }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        retryAfterSeconds: { type: integer }
        locked: { type: boolean }
    GameState:
      type: object
      properties:
        teamId: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [NOT_STARTED, HINT_UNLOCKED, CHALLENGE_OPEN, FINALE, COMPLETED]
        level: { type: integer, description: "-1 = not started, k = hop k solved" }
        totalLevels: { type: integer }
        hint: { type: string }
        challenge: { $ref: "#/components/schemas/Challenge" }
        hopCodes: { type: array, items: { type: string } }
        penaltySeconds: { type: integer }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        serverTime: { type: string, format: date-time }
        collectedKeywords: { type: array, items: { type: string } }
        eventStatus: { type: string, enum: [DRAFT, LIVE, ENDED] }
    Settings:
      type: object
      properties:
        eventName: { type: string }
        tagline: { type: string }
        totalLevels: { type: integer, minimum: 1, maximum: 12 }
        maxAttemptsPerQuestion: { type: integer }
        wrongAnswerCooldownSeconds: { type: integer }
        wrongAnswerTimePenaltySeconds: { type: integer }
        outOfAttemptsAction: { type: string, enum: [SWAP_QUESTION, LOCK_UNTIL_ADMIN] }
        eventStatus: { type: string, enum: [DRAFT, LIVE, ENDED] }
        showLeaderboardToTeams: { type: boolean }
    Question:
      type: object
      required: [prompt, options, correctKey]
      properties:
        questionId: { type: integer }
        prompt: { type: string }
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: object
            properties:
              key: { type: string }
              text: { type: string }
        correctKey: { type: string }
        explanation: { type: string }
        section: { type: string }
        difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
        active: { type: boolean }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in (team or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, password]
              properties:
                teamId: { type: string }
                password: { type: string }
      responses:
        "200": { description: "{ token, team: { teamId, name, role, level } }" }
        "401": { description: Invalid credentials }
        "429": { description: Too many attempts }

  /settings/public:
    get:
      tags: [Settings]
      summary: Branding and event status (no auth)
      responses:
        "200": { description: eventName, tagline, totalLevels, eventStatus, showLeaderboardToTeams }

  /game/state:
    get:
      tags: [Game]
      security: [{ bearer: [] }]
      summary: Resumable game state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameState" }

  /game/scan:
    post:
      tags: [Game]
      security: [{ bearer: [] }]
      summary: Scan the Start QR, or open the challenge for the next location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrString]
              properties: { qrString: { type: string } }
      responses:
        "200": { description: "{ msg, state }" }
        "400": { description: Wrong QR / not the next location }
        "403": { description: Event not LIVE }

  /game/answer:
    post:
      tags: [Game]
      security: [{ bearer: [] }]
      summary: Answer the open challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, optionKey]
              properties:
                level: { type: integer }
                optionKey: { type: string }
      responses:
        "200": { description: "Correct. { correct: true, msg, explanation, keyword, state }" }
        "400": { description: "Wrong. { correct: false, attemptsLeft, penaltyAdded, swapped, locked, retryAfterSeconds, state }" }
        "409": { description: Already answered (double submit) }
        "429": { description: Cooling down or locked }

  /game/submit:
    post:
      tags: [Game]
      security: [{ bearer: [] }]
      summary: Submit the Mega Puzzle order (hop codes joined with "-")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties: { answer: { type: string, example: "DNS-HUB-NAT" } }
      responses:
        "200": { description: "{ correct: true, msg, state }" }
        "400": { description: "Wrong order or still locked" }
        "429": { description: Cooling down }

  /admin/stats:
    get:
      tags: [Admin]
      security: [{ bearer: [] }]
      summary: Leaderboard and distribution (add ?level=N for fastest per level)
      responses:
        "200": { description: "{ leaderboard[], distribution[], totalLevels }" }
  /admin/results.csv:
    get:
      tags: [Admin]
      security: [{ bearer: [] }]
      summary: Final standings as CSV
      responses:
        "200": { description: text/csv }
  /admin/settings:
    get:
      tags: [Admin]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    put:
      tags: [Admin]
      security: [{ bearer: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200": { description: Saved }
        "400": { description: Validation error }
  /admin/teams:
    get: { tags: [Admin], security: [{ bearer: [] }], summary: List teams, responses: { "200": { description: OK } } }
    post: { tags: [Admin], security: [{ bearer: [] }], summary: "Create a team (name, email = team lead, password). Triggers the login email", responses: { "201": { description: Created } } }
  /admin/teams/{id}:
    delete: { tags: [Admin], security: [{ bearer: [] }], summary: Delete a team, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Deleted } } }
  /admin/teams/{id}/path:
    put: { tags: [Admin], security: [{ bearer: [] }], summary: "Set a team's path (before it starts; [0, ...locationIds])", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Updated }, "400": { description: Invalid path } } }
  /admin/teams/{id}/challenges:
    get: { tags: [Admin], security: [{ bearer: [] }], summary: "A team's questions with answers (organiser only)", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /admin/teams/{id}/reshuffle:
    post: { tags: [Admin], security: [{ bearer: [] }], summary: New random question set (only before the team starts), parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /admin/teams/{id}/reset:
    post: { tags: [Admin], security: [{ bearer: [] }], summary: "Reset to the start with a new path and questions", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /admin/teams/{id}/unlock:
    post: { tags: [Admin], security: [{ bearer: [] }], summary: Clear the cooldown or lock on the current level, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /admin/teams/{id}/force-complete:
    post: { tags: [Admin], security: [{ bearer: [] }], summary: Mark the team's current level solved (logged), parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /admin/locations:
    get: { tags: [Admin], security: [{ bearer: [] }], summary: List locations, responses: { "200": { description: OK } } }
    post: { tags: [Admin], security: [{ bearer: [] }], summary: "Create a location (name, hint, keyword)", responses: { "201": { description: Created } } }
  /admin/locations/{id}:
    put: { tags: [Admin], security: [{ bearer: [] }], summary: "Edit name, hint, keyword, qrSecret", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: Updated } } }
    delete: { tags: [Admin], security: [{ bearer: [] }], summary: Delete (not Start, not if on a team path), parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: Deleted } } }
  /admin/locations/{id}/regenerate-secret:
    post: { tags: [Admin], security: [{ bearer: [] }], summary: New QR secret (old printed code stops working), parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: OK } } }
  /admin/questions:
    get: { tags: [Admin], security: [{ bearer: [] }], summary: "List questions (?q=&difficulty=&section=)", responses: { "200": { description: "{ questions[], active, needed }" } } }
    post:
      tags: [Admin]
      security: [{ bearer: [] }]
      summary: Create a question
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Question" }
      responses: { "201": { description: Created }, "400": { description: Invalid } }
  /admin/questions/{id}:
    put: { tags: [Admin], security: [{ bearer: [] }], summary: Update a question, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: Updated } } }
    delete: { tags: [Admin], security: [{ bearer: [] }], summary: "Delete (deactivated instead if already assigned to a team)", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: OK } } }
  /admin/questions/import:
    post: { tags: [Admin], security: [{ bearer: [] }], summary: "Bulk upsert from a JSON array", responses: { "200": { description: Imported }, "400": { description: Invalid } } }
  /admin/questions/export:
    get: { tags: [Admin], security: [{ bearer: [] }], summary: Export all questions as JSON, responses: { "200": { description: OK } } }
